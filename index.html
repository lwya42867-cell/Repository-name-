<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة المراقبة الشرق الأوسط</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #map { width: 100vw; height: 100vh; background: #111; }
        
        /* فلتر لجعل خريطة OSM داكنة */
        .leaflet-layer { filter: grayscale(100%) invert(100%) contrast(1.2) brightness(0.8) hue-rotate(180deg); }

        #hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 20, 0, 0.9); border: 1px solid #0f0;
            padding: 15px; color: #0f0; z-index: 1000; text-align: right;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            border-radius: 5px; pointer-events: none; min-width: 200px;
        }
        #hud h1 { margin: 0 0 10px 0; font-size: 16px; text-transform: uppercase; }
        .data-row { font-size: 12px; margin-bottom: 5px; }
        .data-row span { color: #fff; }
        
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, rgba(0,255,0,0) 0%, rgba(0,255,0,0.1) 50%, rgba(0,255,0,0) 100%);
            animation: scan 6s linear infinite; z-index: 999; pointer-events: none;
        }
        @keyframes scan { 0% { top: -100px; } 100% { top: 100%; } }

        .plane-icon { font-size: 18px; text-shadow: 0 0 5px #0ff; }
        .cam-icon { font-size: 18px; text-shadow: 0 0 5px #0f0; }
        
        .leaflet-popup-content-wrapper { background: #000; color: #0f0; border: 1px solid #0f0; border-radius: 5px; }
        .leaflet-popup-tip { background: #0f0; }
        .leaflet-popup-content img { border: 1px solid #0f0; max-width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="hud">
        <h1>SYSTEM ONLINE 🟢</h1>
        <div class="data-row">المنطقة: <span>الشرق الأوسط</span></div>
        <div class="data-row">الطائرات: <span id="plane-count">جاري الجلب...</span></div>
        <div class="data-row">الكاميرات: <span id="cam-count">جاري الجلب...</span></div>
    </div>
    
    <div id="map"></div>

    <script>
        // 1. تهيئة الخريطة
        var map = L.map('map', { zoomControl: false }).setView([30.0, 45.0], 5);
        L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        // 2. جلب الطائرات (مصدر جديد مفتوح: adsb.lol)
        async function fetchFlights() {
            const el = document.getElementById('plane-count');
            try {
                // نبحث في نطاق 1000 ميل بحري حول العراق (30, 45)
                const res = await fetch('https://api.adsb.lol/v2/lat/30/lon/45/dist/1000');
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                let count = 0;
                
                if (data.ac) {
                    data.ac.forEach(plane => {
                        if (plane.lat && plane.lon) {
                            count++;
                            let flightName = plane.flight ? plane.flight.trim() : 'غير معروف';
                            L.marker([plane.lat, plane.lon], {
                                icon: L.divIcon({ className: 'plane-icon', html: '✈️', iconSize: [20, 20] })
                            }).bindPopup(`<b>رحلة: ${flightName}</b><br>الارتفاع: ${plane.alt_baro} قدم`).addTo(map);
                        }
                    });
                }
                el.innerText = count + ' طائرة';
            } catch (e) { 
                el.innerText = 'فشل الجلب (تأكد من الإنترنت)'; 
            }
        }

        // 3. جلب الكاميرات (Windy API)
        const WINDY_API_KEY = "1KJaSrk7x4uofCDDGsZXds7SGhcsuzX2"; 
        const BBOX = "42.1,55.7,16.3,25.6"; 

        async function fetchWebcams() {
            const el = document.getElementById('cam-count');
            try {
                const url = `https://api.windy.com/webcams/api/v3/webcams?bbox=${BBOX}&limit=100&include=images,location&lang=ar`;
                const res = await fetch(url, { headers: { 'x-windy-api-key': WINDY_API_KEY } });
                if(!res.ok) throw new Error("API Error");
                const data = await res.json();
                let count = 0;
                if (data.webcams) {
                    data.webcams.forEach(cam => {
                        const { location, images } = cam;
                        if (location && location.latitude && location.longitude) {
                            count++;
                            const popupContent = `<div style="text-align:center;"><h3>${location.city || 'كاميرا'}</h3><img src="${images?.current?.preview || ''}" /></div>`;
                            L.marker([location.latitude, location.longitude], {
                                icon: L.divIcon({ className: 'cam-icon', html: '📷', iconSize: [20, 20] })
                            }).bindPopup(popupContent).addTo(map);
                        }
                    });
                }
                el.innerText = count + ' كاميرا';
            } catch (e) { 
                el.innerText = 'فشل (تحقق من المفتاح)'; 
            }
        }

        // تشغيل الجلب
        fetchFlights();
        fetchWebcams();
        
        // تحديث تلقائي كل دقيقة
        setInterval(() => { 
            map.eachLayer(function (layer) { if(layer instanceof L.Marker) { map.removeLayer(layer); } });
            fetchFlights(); 
            fetchWebcams(); 
        }, 60000);
    </script>
</body>
</html>
