<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة المراقبة الشرق الأوسط</title>
    
    <!-- استدعاء مكتبة Leaflet الخفيفة -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <style>
        body { margin: 0; padding: 0; background-color: #000; overflow: hidden; font-family: 'Courier New', Courier, monospace; }
        #map { width: 100vw; height: 100vh; background: #000; }
        
        /* واجهة الهاكر (HUD) */
        #hud {
            position: absolute; top: 20px; right: 20px;
            background: rgba(0, 20, 0, 0.85); border: 1px solid #0f0;
            padding: 15px; color: #0f0; z-index: 1000; text-align: right;
            box-shadow: 0 0 15px rgba(0, 255, 0, 0.3);
            border-radius: 5px; pointer-events: none;
        }
        #hud h1 { margin: 0 0 10px 0; font-size: 16px; text-transform: uppercase; }
        .data-row { font-size: 12px; margin-bottom: 5px; }
        .data-row span { color: #fff; }
        
        /* تأثير خط المسح */
        .scanline {
            position: absolute; top: 0; left: 0; width: 100%; height: 100px;
            background: linear-gradient(to bottom, rgba(0,255,0,0) 0%, rgba(0,255,0,0.1) 50%, rgba(0,255,0,0) 100%);
            animation: scan 6s linear infinite; z-index: 999; pointer-events: none;
        }
        @keyframes scan { 0% { top: -100px; } 100% { top: 100%; } }

        /* تنسيق الأيقونات (الطائرات والكاميرات) */
        .plane-icon { font-size: 16px; text-shadow: 0 0 5px #0ff; }
        .cam-icon { font-size: 16px; text-shadow: 0 0 5px #0f0; }
        
        /* تخصيص نافذة الكاميرا المنبثقة */
        .leaflet-popup-content-wrapper { background: #000; color: #0f0; border: 1px solid #0f0; border-radius: 5px; }
        .leaflet-popup-tip { background: #0f0; }
        .leaflet-popup-content img { border: 1px solid #0f0; max-width: 100%; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="scanline"></div>
    <div id="hud">
        <h1>SYSTEM ONLINE 🟢</h1>
        <div class="data-row">المنطقة: <span>الشرق الأوسط</span></div>
        <div class="data-row">الطائرات: <span id="plane-count">جاري الاتصال...</span></div>
        <div class="data-row">الكاميرات: <span id="cam-count">جاري الاتصال...</span></div>
    </div>
    
    <div id="map"></div>

    <script>
        // 1. تهيئة الخريطة (الشرق الأوسط)
        var map = L.map('map', { zoomControl: false }).setView([30.0, 45.0], 5);
        
        // استخدام خريطة داكنة (Dark Matter) لتبدو كشاشة هاكر
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CartoDB',
            subdomains: 'abcd',
            maxZoom: 19
        }).addTo(map);

        // 2. جلب الطائرات
        async function fetchFlights() {
            const el = document.getElementById('plane-count');
            try {
                const res = await fetch('https://opensky-network.org/api/states/all?lamin=12&lomin=35&lamax=42&lomax=60');
                const data = await res.json();
                let count = 0;
                if (data.states) {
                    data.states.forEach(state => {
                        const [icao, callsign, origin, lon, lat, alt] = state;
                        if (lat && lon) {
                            count++;
                            L.marker([lat, lon], {
                                icon: L.divIcon({ className: 'plane-icon', html: '✈️', iconSize: [20, 20] })
                            }).bindPopup(`<b>رحلة: ${callsign ? callsign.trim() : 'غير معروف'}</b><br>الارتفاع: ${alt}m`).addTo(map);
                        }
                    });
                }
                el.innerText = count + ' طائرة';
            } catch (e) { el.innerText = 'تعذر الجلب'; }
        }

        // 3. جلب الكاميرات
        const WINDY_API_KEY = "1KJaSrk7x4uofCDDGsZXds7SGhcsuzX2"; 
        const BBOX = "42.1,55.7,16.3,25.6"; 

        async function fetchWebcams() {
            const el = document.getElementById('cam-count');
            try {
                const url = `https://api.windy.com/webcams/api/v3/webcams?bbox=${BBOX}&limit=100&include=images,location&lang=ar`;
                const res = await fetch(url, { headers: { 'x-windy-api-key': WINDY_API_KEY } });
                const data = await res.json();
                let count = 0;
                if (data.webcams) {
                    data.webcams.forEach(cam => {
                        const { location, images } = cam;
                        if (location && location.latitude && location.longitude) {
                            count++;
                            const popupContent = `
                                <div style="text-align:center;">
                                    <h3 style="margin:0 0 5px 0;">${location.city || 'كاميرا'}</h3>
                                    <img src="${images?.current?.preview || ''}" style="width:200px;" />
                                </div>
                            `;
                            L.marker([location.latitude, location.longitude], {
                                icon: L.divIcon({ className: 'cam-icon', html: '📷', iconSize: [20, 20] })
                            }).bindPopup(popupContent).addTo(map);
                        }
                    });
                }
                el.innerText = count + ' كاميرا';
            } catch (e) { el.innerText = 'خطأ في المفتاح'; }
        }

        // تشغيل الجلب
        fetchFlights();
        fetchWebcams();
        
        // تحديث تلقائي كل دقيقة
        setInterval(() => { 
            map.eachLayer(function (layer) { if(layer instanceof L.Marker) { map.removeLayer(layer); } });
            fetchFlights(); 
            fetchWebcams(); 
        }, 60000);
    </script>
</body>
</html>
